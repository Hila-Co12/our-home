<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#3E6B6B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="הבית שלנו">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500&display=swap" rel="stylesheet">
<title>הבית שלנו</title>
<style>
:root{--primary:#3E6B6B;--secondary:#A7C4BC;--urgent:#B83A2E;--bg:#F4F7F5;--card:#FFFFFF;--text:#24302E;--muted:#6B7A76}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#1b2321;--card:#243029;--text:#e8efec;--muted:#9fb3ad}}
:root[data-theme="dark"]{--bg:#1b2321;--card:#243029;--text:#e8efec;--muted:#9fb3ad}
*{box-sizing:border-box}
body{margin:0;font-family:Heebo,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;font-weight:400;background:var(--bg);color:var(--text);min-height:100vh}
header{position:sticky;top:0;z-index:1;background:var(--primary);color:#fff;display:flex;align-items:center;gap:10px;padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top))}
header .logo{width:36px;height:36px;border-radius:10px;background:#fff;flex:0 0 auto}
header h1{font-size:22px;font-weight:300;margin:0;flex:1;letter-spacing:.3px}
main{padding:16px;max-width:640px;margin:0 auto;padding-bottom:max(24px,env(safe-area-inset-bottom))}
.hello{margin:4px 0 14px}
.hello .hi{font-size:28px;font-weight:300;line-height:1.2}
h2{font-size:18px;font-weight:400;margin:22px 0 8px}
.card{background:var(--card);border-radius:14px;padding:14px 16px;margin-bottom:12px;border-inline-start:5px solid var(--primary);box-shadow:0 1px 3px rgba(0,0,0,.06)}
.card.urgent{border-inline-start-color:var(--urgent)}
.card .title{font-size:16px;font-weight:500;margin:8px 0 2px}
.card.done-card{opacity:.85}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:13px;font-weight:500;background:var(--secondary);color:var(--text)}
.badge.urgent{background:var(--urgent);color:#fff}
.muted{color:var(--muted);font-size:14px}
.pick{display:flex;gap:12px;align-items:flex-start}
.pick input{width:22px;height:22px;margin-top:4px;accent-color:var(--primary);flex:0 0 auto;cursor:pointer}
.body{flex:1;min-width:0}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 4px}
.chip{background:var(--card);color:var(--text);border:1px solid var(--secondary);padding:6px 14px;border-radius:999px;min-height:36px;font-size:14px;font-family:inherit}
.chip.on{background:var(--primary);color:#fff;border-color:var(--primary)}
.exp-row{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--card);border-radius:12px;padding:12px 14px;margin-bottom:8px;border-inline-start:4px solid var(--primary);cursor:pointer}
.exp-row .name{font-weight:500;font-size:15px}
.exp-row .date{color:var(--muted);font-size:13px;margin-top:2px}
.exp-row .left{text-align:left;font-size:14px;white-space:nowrap}
.linkish{background:none;border:0;color:var(--primary);padding:0;min-height:0;font:inherit;text-decoration:underline;cursor:pointer;font-size:14px;margin-top:4px}
.info-row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--bg)}
.info-row:last-child{border-bottom:0}
.btn{display:inline-flex;align-items:center;justify-content:center;background:var(--primary);color:#fff;text-decoration:none;border-radius:12px;padding:12px 16px;min-height:44px;font-size:15px}
.btn.light{background:var(--secondary);color:var(--text)}
.detail-preview iframe{width:100%;height:420px;border:0;border-radius:14px;background:var(--card);margin-bottom:12px;display:block}
.contacts{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin-bottom:12px}
.contact{display:flex;flex-direction:column;align-items:center;gap:6px;text-decoration:none;color:var(--text);font-size:13px;width:76px}
.contact .ico{width:58px;height:58px;border-radius:50%;background:var(--primary);display:flex;align-items:center;justify-content:center}
.contact .ico svg{width:26px;height:26px;fill:#fff}
.file-btn{margin-top:12px}
button{font:inherit;border:0;border-radius:12px;padding:12px 18px;background:var(--primary);color:#fff;cursor:pointer;min-height:44px}
button.ghost{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.6);padding:8px 12px;min-height:36px}
button.small{padding:8px 12px;min-height:36px;font-size:14px;background:var(--secondary);color:var(--text)}
.login{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:14px}
.login img{width:120px;height:120px;border-radius:24px}
.login h1{margin:0;font-weight:300}
#appView main{padding-bottom:110px}
.fab{position:fixed;bottom:max(20px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);box-shadow:0 6px 18px rgba(0,0,0,.2);padding:14px 24px;border-radius:999px;font-size:16px;z-index:2;white-space:nowrap}
.form{display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--muted)}
.field input,.field select{font:inherit;font-size:16px;padding:12px;border-radius:12px;border:1px solid var(--secondary);background:var(--card);color:var(--text);min-height:44px}
.srcs{display:flex;gap:8px;flex-wrap:wrap}
.srcBtn{flex:1;min-width:90px;text-align:center;background:var(--card);color:var(--text);border:1px solid var(--secondary);border-radius:12px;padding:12px;min-height:44px;font-size:15px;display:flex;align-items:center;justify-content:center;cursor:pointer;margin:0;font-family:inherit}
.srcBtn input{display:none}
.choices{display:flex;flex-direction:column;gap:12px;margin-top:8px}
.choice{display:flex;align-items:center;gap:14px}
.choice .ico{width:44px;height:44px;border-radius:50%;background:var(--primary);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.choice .ico svg{width:22px;height:22px;fill:#fff}
.choice{background:var(--card);color:var(--text);border:1px solid var(--secondary);border-radius:14px;padding:18px;font-size:17px;text-align:start;min-height:60px;box-shadow:0 1px 3px rgba(0,0,0,.06);font-family:inherit}
#saveBtn{margin-top:6px}
.preview{margin-top:14px}
.preview img{width:100%;border-radius:12px;display:block}
.preview iframe{width:100%;height:360px;border:0;border-radius:12px;background:var(--card)}
.hidden{display:none !important}
.error{color:var(--urgent);font-weight:500}
</style>
</head>
<body>

<section id="loginView" class="login">
  <img src="icon-512.png" alt="">
  <h1>הבית שלנו</h1>
  <p class="muted">מסמכים, תוקפים ומשימות במקום אחד</p>
  <button id="loginBtn">היכנסו עם Google</button>
  <p id="loginError" class="error hidden"></p>
</section>

<section id="appView" class="hidden">
  <header>
    <img class="logo" src="icon-192.png" alt="">
    <h1>הבית שלנו</h1>
    <button class="ghost" id="refreshBtn">רענון</button>
    <button class="ghost" id="logoutBtn">יציאה</button>
  </header>
  <main>
    <div class="hello">
      <div class="hi" id="greeting"></div>
    </div>

    <h2>משימות</h2>
    <div class="chips">
      <button class="chip on" id="tabOpen">משימות פתוחות</button>
      <button class="chip" id="tabDone">משימות שטופלו</button>
    </div>
    <div id="filters" class="chips"></div>
    <div id="status" class="muted"></div>
    <div id="tasks"></div>

    <h2>פג בקרוב</h2>
    <div id="expiring"></div>
  </main>
  <button class="fab" id="addBtn">+ הוספת מסמך</button>
</section>

<section id="detailView" class="hidden">
  <header>
    <button class="ghost" id="backBtn">חזרה</button>
    <h1>פרטי מסמך</h1>
  </header>
  <main id="detailMain"></main>
</section>

<section id="addView" class="hidden">
  <header>
    <button class="ghost" id="addBackBtn">ביטול</button>
    <h1>הוספת מסמך</h1>
  </header>
  <main id="addChoose">
    <div class="choices">
      <button type="button" class="choice" id="chooseCam"><span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4zM9 2L7.17 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2h-3.17L15 2H9zm3 15c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z"/></svg></span><span>מצלמה</span></button>
      <button type="button" class="choice" id="choosePhotos"><span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M22 16V4c0-1.1-.9-2-2-2H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2zm-11-4l2.03 2.71L16 11l4 5H8l3-4zM2 6v14c0 1.1.9 2 2 2h14v-2H4V6H2z"/></svg></span><span>תמונות</span></button>
      <button type="button" class="choice" id="chooseFiles"><span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg></span><span>קבצים</span></button>
      <button type="button" class="choice" id="chooseNone"><span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg></span><span>מילוי ידני</span></button>
    </div>
    <input type="file" accept="image/*" capture="environment" id="fileCam" class="hidden">
    <input type="file" accept="image/*" id="filePhotos" class="hidden">
    <input type="file" accept="application/pdf" id="fileFiles" class="hidden">
  </main>
  <main id="addFormWrap" class="hidden">
    <form id="addForm" class="form">
      <p class="muted" id="fileName">לא נבחר קובץ</p>

      <label class="field">שם המסמך<input name="name" required></label>
      <label class="field">סוג
        <select name="typeSelect" id="typeSelect"></select>
      </label>
      <label class="field hidden" id="newTypeWrap">סוג חדש<input name="newType"></label>
      <label class="field">בעלים
        <select name="owner">
          <option>הילה</option>
          <option>שי</option>
          <option>משותף</option>
        </select>
      </label>
      <label class="field">תאריך תפוגה<input name="expiry" type="date"></label>
      <label class="field">ספק<input name="provider" id="providerInput" list="providerList" autocomplete="off"><datalist id="providerList"></datalist></label>
      <button type="button" class="linkish" id="providerSearch">חיפוש שירות לקוחות באינטרנט</button>
      <p class="muted" id="providerInfo"></p>
      <label class="field hidden" id="updProviderWrap"><span><input type="checkbox" id="updProvider"> עדכני גם בטאב "ספקים"</span></label>
      <label class="field">מחיר<input name="price" inputmode="decimal"></label>
      <label class="field">טלפון<input name="phone" type="tel"></label>
      <label class="field">וואטסאפ<input name="whatsapp" type="tel"></label>
      <label class="field">מייל<input name="email" type="email"></label>
      <label class="field">אתר<input name="website" type="url"></label>

      <button type="submit" id="saveBtn">שמירה</button>
      <p id="addStatus" class="muted"></p>
      <div id="preview" class="preview"></div>
    </form>
  </main>
</section>

<script>
/* ===== הגדרות ===== */
const CONFIG = {
  clientId: '234620211821-prcopobtu7dsuq1repcuf40utpf1fj67.apps.googleusercontent.com',
  sheetId: '1yFDkw0BkKyioAyQC1ulOjj9h97fiufO2Byox9ue0nAo',
  // מייל -> שם תצוגה. רק המיילים האלה יכולים להיכנס לאפליקציה
  allowedEmails: { 'hila1993@gmail.com': 'הילה' },
  tasksTab: 'משימות',
  docsTab: 'מסמכים',
  owners: ['הכל', 'הילה', 'שי', 'משותף'],
  maxTasks: 5,
  maxExpiring: 8,
};
const SCOPES = 'https://www.googleapis.com/auth/spreadsheets https://www.googleapis.com/auth/drive.file https://www.googleapis.com/auth/userinfo.email';

/* שמות העמודות - האפליקציה מחפשת את השם הראשון שנמצא */
const TASK_COLS = {
  title: ['כותרת', 'משימה', 'תיאור', 'נושא'],
  doc: ['מסמך', 'שם המסמך', 'שם מסמך'],
  due: ['תאריך יעד', 'תאריך', 'יעד'],
  status: ['סטטוס'],
  key: ['מפתח'],
};
const DOC_COLS = {
  id: ['מזהה'],
  name: ['שם מסמך'],
  type: ['סוג'],
  owner: ['בעלים'],
  expiry: ['תאריך תפוגה'],
  price: ['מחיר', 'מחיר חודשי'],
  provider: ['ספק'],
  file: ['קישור לקובץ'],
  phone: ['טלפון ספק'],
  whatsapp: ['וואטסאפ ספק', 'קישור לוואטסאפ'],
  email: ['מייל ספק'],
  website: ['אתר ספק'],
  active: ['פעיל'],
};

const $ = id => document.getElementById(id);
let tokenClient = null, accessToken = null, tokenExpiresAt = 0, userName = '';
const state = { tasks: [], docs: [], types: [], providers: [], filter: 'הכל', view: 'open', detailId: null };

/* ===== התחברות ===== */
function initGis() {
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: CONFIG.clientId,
    scope: SCOPES,
    callback: onToken,
    error_callback: () => {
      showLoginError('ההתחברות בוטלה או נכשלה. נסי שוב.');
      $('status').textContent = 'צריך להתחבר מחדש. לחצי על יציאה והתחברי שוב.';
    },
  });
  $('loginBtn').onclick = () => tokenClient.requestAccessToken();
}

async function onToken(resp) {
  if (resp.error) { showLoginError('ההתחברות נכשלה.'); return; }
  accessToken = resp.access_token;
  tokenExpiresAt = Date.now() + (resp.expires_in - 60) * 1000;

  let email = '';
  try {
    const r = await fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
      headers: { Authorization: 'Bearer ' + accessToken },
    });
    email = ((await r.json()).email || '').toLowerCase();
  } catch (e) { email = ''; }

  const allowed = Object.keys(CONFIG.allowedEmails).find(k => k === email);
  if (!allowed) {
    google.accounts.oauth2.revoke(accessToken, () => {});
    accessToken = null;
    showLoginError('אין לך הרשאה לגשת לאפליקציה הזו.');
    return;
  }
  userName = CONFIG.allowedEmails[allowed];
  showApp();
  loadAll();
}

function showLoginError(msg) {
  const e = $('loginError');
  e.textContent = msg;
  e.classList.remove('hidden');
}

function greetingTime() {
  const h = new Date().getHours();
  if (h >= 5 && h < 12) return 'בוקר טוב';
  if (h >= 12 && h < 17) return 'צהריים טובים';
  return 'ערב טוב';
}

function showApp() {
  $('loginView').classList.add('hidden');
  $('detailView').classList.add('hidden');
  $('appView').classList.remove('hidden');
  $('greeting').textContent = `${greetingTime()} ${userName}`;
}

function logout() {
  if (accessToken) google.accounts.oauth2.revoke(accessToken, () => {});
  accessToken = null;
  tokenExpiresAt = 0;
  state.tasks = [];
  state.docs = [];
  state.detailId = null;
  $('addView').classList.add('hidden');
  $('tasks').innerHTML = '';
  $('expiring').innerHTML = '';
  $('filters').innerHTML = '';
  $('status').textContent = '';
  $('detailView').classList.add('hidden');
  $('appView').classList.add('hidden');
  $('loginView').classList.remove('hidden');
  $('loginError').classList.add('hidden');
}

/* ===== גישה לגיליון ===== */
function sheetUrl(path) {
  return `https://sheets.googleapis.com/v4/spreadsheets/${CONFIG.sheetId}/${path}`;
}

async function sheetsGet(path) {
  const r = await fetch(sheetUrl(path), { headers: { Authorization: 'Bearer ' + accessToken } });
  if (r.status === 401 || r.status === 403) throw new Error('AUTH');
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

async function sheetsWrite(range, value) {
  const r = await fetch(sheetUrl(`values/${encodeURIComponent(range)}?valueInputOption=USER_ENTERED`), {
    method: 'PUT',
    headers: { Authorization: 'Bearer ' + accessToken, 'Content-Type': 'application/json' },
    body: JSON.stringify({ values: [[value]] }),
  });
  if (r.status === 401 || r.status === 403) throw new Error('AUTH');
  if (!r.ok) throw new Error('HTTP ' + r.status);
}

async function loadAll() {
  if (CONFIG.sheetId.startsWith('PASTE')) {
    $('status').textContent = 'חסר מזהה גיליון בקובץ ההגדרות.';
    return;
  }
  if (!accessToken || Date.now() >= tokenExpiresAt) {
    $('status').textContent = 'פג תוקף ההתחברות. לחצי על רענון.';
    return;
  }
  $('status').textContent = 'טוען...';
  try {
    const [tasksData, docsData] = await Promise.all([
      sheetsGet(`values/${encodeURIComponent(CONFIG.tasksTab)}?valueRenderOption=FORMATTED_VALUE`),
      sheetsGet(`values/${encodeURIComponent(CONFIG.docsTab)}?valueRenderOption=FORMATTED_VALUE`),
    ]);
    state.docs = parseDocs(docsData.values || []);
    state.tasks = parseTasks(tasksData.values || [], state.docs);
    state.types = await loadSettings().catch(() => []);
    state.providers = await loadProviders().catch(() => []);
    renderFilters();
    renderTasks();
    renderExpiring();
  } catch (e) {
    $('status').textContent = e.message === 'AUTH'
      ? 'צריך להתחבר מחדש. לחצי על יציאה והתחברי שוב.'
      : 'שגיאה בטעינה. נסי שוב.';
  }
}

/* ===== עיבוד נתונים ===== */
function findCol(header, names) {
  for (const n of names) {
    const i = header.indexOf(n);
    if (i >= 0) return i;
  }
  return -1;
}

function colLetter(i) {
  return String.fromCharCode(65 + i);
}

function parseDate(s) {
  if (!s) return null;
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (m) return new Date(+m[1], +m[2] - 1, +m[3]);
  m = s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})/);
  if (m) {
    let y = +m[3];
    if (y < 100) y += 2000;
    return new Date(y, +m[2] - 1, +m[1]);
  }
  return null;
}

function parseDocs(rows) {
  if (rows.length < 2) return [];
  const header = rows[0].map(h => String(h).trim());
  const c = {};
  for (const k in DOC_COLS) c[k] = findCol(header, DOC_COLS[k]);
  const get = (row, i) => (i >= 0 && row[i] != null) ? String(row[i]).trim() : '';

  const docs = [];
  for (const row of rows.slice(1)) {
    const id = get(row, c.id);
    if (!id) continue;
    docs.push({
      id,
      name: get(row, c.name) || 'מסמך',
      type: get(row, c.type),
      owner: get(row, c.owner),
      expiry: parseDate(get(row, c.expiry)),
      expiryStr: get(row, c.expiry),
      price: get(row, c.price),
      provider: get(row, c.provider),
      file: get(row, c.file),
      phone: get(row, c.phone),
      whatsapp: get(row, c.whatsapp),
      email: get(row, c.email),
      website: get(row, c.website),
      active: get(row, c.active) !== 'FALSE',
    });
  }
  return docs;
}

function parseTasks(rows, docs) {
  if (rows.length < 2) return [];
  const header = rows[0].map(h => String(h).trim());
  const c = {};
  for (const k in TASK_COLS) c[k] = findCol(header, TASK_COLS[k]);
  const docById = Object.fromEntries(docs.map(d => [d.id, d]));
  const get = (row, i) => (i >= 0 && row[i] != null) ? String(row[i]).trim() : '';

  const tasks = [];
  rows.forEach((row, index) => {
    if (index === 0) return;
    const status = get(row, c.status);
    if (status === 'הועבר לדחופה') return;

    const key = get(row, c.key);
    const docId = key.split('|')[0];
    const doc = get(row, c.doc);
    const dueStr = get(row, c.due);
    tasks.push({
      sheetRow: index + 1,
      status: status || 'פתוחה',
      title: get(row, c.title) || doc || 'משימה',
      doc,
      docId,
      dueStr,
      due: parseDate(dueStr),
      urgent: key.includes('|דחוף'),
      owner: docById[docId] ? docById[docId].owner : '',
      statusCol: c.status,
    });
  });
  return tasks;
}

/* ===== תצוגה ===== */
function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
}

function startOfToday() {
  const d = new Date();
  d.setHours(0, 0, 0, 0);
  return d;
}

function daysText(due) {
  const days = Math.round((due - startOfToday()) / 86400000);
  if (days < 0) return `עבר לפני ${-days} ימים`;
  if (days === 0) return 'היום';
  return `בעוד ${days} ימים`;
}

function setView(v) {
  state.view = v;
  $('tabOpen').classList.toggle('on', v === 'open');
  $('tabDone').classList.toggle('on', v === 'done');
  renderTasks();
}

function renderFilters() {
  const box = $('filters');
  box.innerHTML = '';
  for (const owner of CONFIG.owners) {
    const b = el('button', 'chip' + (state.filter === owner ? ' on' : ''), owner);
    b.onclick = () => { state.filter = owner; renderFilters(); renderTasks(); };
    box.append(b);
  }
}

function renderTasks() {
  const box = $('tasks');
  box.innerHTML = '';
  const isDone = state.view === 'done';

  const inView = state.tasks.filter(t => (t.status === 'בוצעה') === isDone);
  if (!inView.length) {
    $('status').textContent = isDone ? 'אין משימות שטופלו עדיין.' : 'אין משימות פתוחות. הכול מסודר!';
    return;
  }

  const list = inView
    .filter(t => state.filter === 'הכל' || t.owner === state.filter)
    .sort((a, b) => {
      if (a.urgent !== b.urgent) return a.urgent ? -1 : 1;
      const da = a.due ? a.due.getTime() : Infinity;
      const db = b.due ? b.due.getTime() : Infinity;
      return da - db;
    });

  if (!list.length) {
    $('status').textContent = 'אין משימות למסנן הזה.';
    return;
  }

  const shown = isDone ? list : list.slice(0, CONFIG.maxTasks);
  const more = list.length - shown.length;
  $('status').textContent = more > 0
    ? `מוצגות ${shown.length} מתוך ${list.length} משימות פתוחות`
    : `${list.length} ${isDone ? 'משימות שטופלו' : 'משימות פתוחות'}`;

  for (const t of shown) box.append(taskCard(t, isDone));
  if (more > 0) box.append(el('p', 'muted', `ועוד ${more} משימות`));
}

function taskCard(t, isDone) {
  const card = el('div', 'card' + (t.urgent && !isDone ? ' urgent' : '') + (isDone ? ' done-card' : ''));
  const pick = el('div', 'pick');

  if (!isDone) {
    const box = el('input');
    box.type = 'checkbox';
    box.setAttribute('aria-label', 'סמני כבוצעה');
    box.onchange = () => markDone(t, box);
    pick.append(box);
  }

  const body = el('div', 'body');
  const top = el('div', 'row');
  if (isDone) {
    top.append(el('span', 'badge', 'טופלה'));
  } else {
    top.append(el('span', 'badge' + (t.urgent ? ' urgent' : ''), t.urgent ? 'דחוף' : 'לטיפול'));
  }
  if (t.due) top.append(el('span', 'muted', daysText(t.due)));
  else if (t.dueStr) top.append(el('span', 'muted', t.dueStr));
  body.append(top, el('div', 'title', t.title));
  if (t.doc && t.doc !== t.title) {
    const docBtn = el('button', 'linkish', t.doc);
    docBtn.onclick = () => openDoc(t.docId);
    body.append(docBtn);
  }

  if (isDone) {
    const undo = el('button', 'small', 'החזרה לפתוחה');
    undo.style.marginTop = '10px';
    undo.onclick = () => reopen(t, undo);
    body.append(undo);
  }

  pick.append(body);
  card.append(pick);
  return card;
}

async function setStatus(t, value) {
  if (t.statusCol < 0) throw new Error('NOCOL');
  await sheetsWrite(`'${CONFIG.tasksTab}'!${colLetter(t.statusCol)}${t.sheetRow}`, value);
  t.status = value;
}

function showStatusError(e) {
  const msg = e.message === 'AUTH'
    ? 'צריך להתחבר מחדש. לחצי על יציאה והתחברי שוב.'
    : e.message === 'NOCOL'
      ? 'לא נמצאה עמודת סטטוס בטאב המשימות.'
      : 'לא הצלחתי לעדכן את המשימה. נסי שוב.';
  $('status').textContent = msg;
}

function afterTaskChange() {
  if (state.detailId) renderDetail(state.detailId);
  else renderTasks();
}

async function markDone(t, box) {
  box.disabled = true;
  try {
    await setStatus(t, 'בוצעה');
    afterTaskChange();
  } catch (e) {
    box.checked = false;
    box.disabled = false;
    showStatusError(e);
  }
}

async function reopen(t, btn) {
  btn.disabled = true;
  try {
    await setStatus(t, 'פתוחה');
    afterTaskChange();
  } catch (e) {
    btn.disabled = false;
    showStatusError(e);
  }
}

  }

function infoRow(parent, label, value) {
  const row = el('div', 'info-row');

function nextDocId() {
  const nums = state.docs
    .map(d => (d.id.match(/^D(\d+)$/) || [])[1])
    .filter(Boolean)
    .map(n => parseInt(n, 10));
  const next = (nums.length ? Math.max(...nums) : 0) + 1;
  return 'D' + String(next).padStart(3, '0');
}

function driveId(url) {
  const m = (url || '').match(/\/d\/([^/?#]+)/);
  return m ? m[1] : '';
}

function intlPhone(p) {
  const digits = p.replace(/\D/g, '');
  return digits.startsWith('0') ? '972' + digits.slice(1) : digits;
}

function waLink(d) {
  const v = (d.whatsapp || '').trim();
  if (v) {
    if (/^https?:\/\//i.test(v)) return v;
    if (/wa\.me|whatsapp\.com/i.test(v)) return 'https://' + v.replace(/^\/+/, '');
    return 'https://wa.me/' + intlPhone(v);
  }
  return '';
}

function renderDetail(id) {
  const d = state.docs.find(x => x.id === id);
  if (!d) { closeDoc(); return; }
  const box = $('detailMain');
  box.innerHTML = '';

  const card = el('div', 'card');
  card.append(el('div', 'title', d.name));
  if (d.type) card.append(el('div', 'muted', d.type));

  const info = el('div', '');
  infoRow(info, 'תאריך תפוגה', d.expiryStr ? `${d.expiryStr}${d.expiry ? ' (' + daysText(d.expiry) + ')' : ''}` : 'לא הוגדר');
  infoRow(info, 'בעלים', d.owner || 'לא הוגדר');
  if (d.provider) infoRow(info, 'ספק', d.provider);
  if (d.price) infoRow(info, 'מחיר', `${d.price} ש״ח`);
  card.append(info);

  box.append(card);

  const fileId = driveId(d.file);
  if (fileId) {
    const pv = el('div', 'detail-preview');
    const frame = el('iframe');
    frame.src = `https://drive.google.com/file/d/${fileId}/preview`;
    frame.title = 'תצוגה מקדימה של המסמך';
    pv.append(frame);
    box.append(pv);
  }

  const contacts = [];
  if (d.file && !fileId) contacts.push(contactBtn('file', 'פתיחת הקובץ', d.file, true));
  if (d.phone) contacts.push(contactBtn('phone', 'חיוג', 'tel:' + d.phone.replace(/[\s-]/g, ''), false));
  const wa = waLink(d);
  if (wa) contacts.push(contactBtn('whatsapp', 'וואטסאפ', wa, true));
  if (d.email) contacts.push(contactBtn('mail', 'מייל', `mailto:${d.email}?subject=${encodeURIComponent('פנייה בנוגע ל' + d.name)}`, false));
  if (d.website) contacts.push(contactBtn('globe', 'אתר הספק', /^https?:\/\//.test(d.website) ? d.website : 'https://' + d.website, true));
  if (contacts.length) {
    box.append(el('h2', '', 'פעולות'));
    const c = el('div', 'contacts');
    contacts.forEach(x => c.append(x));
    box.append(c);
  }

  box.append(el('h2', '', 'משימות של המסמך'));
  const related = state.tasks
    .filter(t => t.docId === d.id)
    .sort((a, b) => (a.status === 'בוצעה') - (b.status === 'בוצעה'));
  if (!related.length) {
    box.append(el('p', 'muted', 'אין משימות למסמך הזה.'));
    return;
  }
  for (const t of related) box.append(taskCard(t, t.status === 'בוצעה'));
}

async function driveFetch(url, options = {}) {
  const r = await fetch(url, {
    ...options,
    headers: { Authorization: 'Bearer ' + accessToken, ...(options.headers || {}) },
  });
  if (r.status === 401 || r.status === 403) {
    let detail = '';
    try { detail = (await r.json()).error.message; } catch (e) { detail = ''; }
    throw new Error('DRIVE_AUTH|' + r.status + '|' + detail);
  }
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

async function getHomeFolder() {
  const q = encodeURIComponent(`name='${HOME_FOLDER_NAME}' and mimeType='application/vnd.google-apps.folder' and trashed=false`);
  const data = await driveFetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id)`);
  if (data.files && data.files.length) return data.files[0].id;
  const created = await driveFetch('https://www.googleapis.com/drive/v3/files?fields=id', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name: HOME_FOLDER_NAME, mimeType: 'application/vnd.google-apps.folder' }),
  });
  return created.id;
}

async function uploadFile(file, folderId) {
  const boundary = 'homebinder' + Date.now();
  const meta = JSON.stringify({ name: file.name, parents: [folderId] });
  const body = new Blob([
    `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${meta}\r\n`,
    `--${boundary}\r\nContent-Type: ${file.type || 'application/octet-stream'}\r\n\r\n`,
    file,
    `\r\n--${boundary}--`,
  ]);
  return driveFetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,webViewLink', {
    method: 'POST',
    headers: { 'Content-Type': `multipart/related; boundary=${boundary}` },
    body,
  });
}

async function appendDocRow(values) {

    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ values: [values] }),
  });
}

$('addForm').onsubmit = async e => {
  e.preventDefault();
  const f = e.target;
  const v = name => (f.elements[name].value || '').trim();
  if (!v('name')) {
    $('addStatus').textContent = 'יש למלא שם מסמך.';
    return;
  }
  const isNewType = f.elements.typeSelect.value === NEW_TYPE;
  const typeName = isNewType ? v('newType') : f.elements.typeSelect.value;
  if (!typeName) {
    $('addStatus').textContent = 'יש לבחור סוג, או להוסיף סוג חדש.';
    return;
  }
  const known = state.types.find(t => t.name === typeName);
  const days = known ? known.days : '30';
  if (!accessToken || Date.now() >= tokenExpiresAt) {
    $('addStatus').textContent = 'פג תוקף ההתחברות. חזרי למסך הראשי והתחברי שוב.';
    return;
  }

  $('saveBtn').disabled = true;
  $('addStatus').textContent = 'שומרת...';
  try {
    let fileUrl = '';
    if (pickedFile) {
      const folderId = await getHomeFolder();
      const up = await uploadFile(pickedFile, folderId);
      fileUrl = up.webViewLink || `https://drive.google.com/file/d/${up.id}/view`;
    }
    const id = nextDocId();
    await appendDocRow([
      id, v('name'), typeName, v('owner'), v('expiry'), days, v('price'),
      v('provider'), fileUrl, v('phone'), v('whatsapp'), v('email'), v('website'), 'TRUE',
    ]);
    const providerName = v('provider');
    const existingProvider = findProvider(providerName);
    if (providerName && !existingProvider) {
      const freshProviders = await loadProviders();
      if (!freshProviders.some(p => p.name === providerName)) {
        await appendProviderRow({ name: providerName, phone: v('phone'), whatsapp: v('whatsapp'), email: v('email'), website: v('website'), updated: todayIso() });
      }
    } else if (existingProvider && $('updProvider').checked) {
      await updateProviderRow(existingProvider.row, { phone: v('phone'), whatsapp: v('whatsapp'), email: v('email'), website: v('website'), updated: todayIso() });
    }
    if (isNewType) {
      const fresh = await loadSettings();
      if (!fresh.some(t => t.name === typeName)) await appendSettingsRow([typeName, '30']);
    }
    history.back();
    await loadAll();
  } catch (err) {
    if (err.message.startsWith('DRIVE_AUTH')) {
      const [, code, detail] = err.message.split('|');
      $('addStatus').textContent = `שגיאה ${code}: ${detail || 'אין פירוט'}`;
    } else if (err.message === 'AUTH') {
      $('addStatus').textContent = 'צריך להתחבר מחדש. לחצי על יציאה והתחברי שוב.';
    } else {
      $('addStatus').textContent = `השמירה נכשלה (${err.message}). נסי שוב.`;
    }
  } finally {
    $('saveBtn').disabled = false;
  }
};

  n.textContent = '+ סוג חדש';
  sel.append(n);
  toggleNewType();
}

async function loadSettings() {
  const data = await driveFetch(sheetUrl(`values/${encodeURIComponent("'הגדרות'!A2:B")}?valueRenderOption=FORMATTED_VALUE`));
  return (data.values || [])
    .map(r => ({ name: String(r[0] || '').trim(), days: String(r[1] || '').trim() || '30' }))
    .filter(t => t.name);
}

async function appendSettingsRow(values) {
  await driveFetch(sheetUrl(`values/${encodeURIComponent("'הגדרות'!A:B")}:append?valueInputOption=USER_ENTERED&insertDataOption=INSERT_ROWS`), {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ values: [values] }),
  });
}

const PROVIDER_COLS = {
  name: ['שם ספק'],
  phone: ['טלפון'],
  whatsapp: ['וואטסאפ'],
  email: ['מייל'],
  website: ['אתר'],
  updated: ['עודכן לאחרונה'],
};
let providerCols = null;

async function loadProviders() {
  const data = await driveFetch(sheetUrl(`values/${encodeURIComponent("'ספקים'!A1:Z")}?valueRenderOption=FORMATTED_VALUE`));
  const rows = data.values || [];
  if (!rows.length) return [];
  const header = rows[0].map(h => String(h).trim());
  const c = {};
  for (const k in PROVIDER_COLS) c[k] = findCol(header, PROVIDER_COLS[k]);
  providerCols = c;
  const get = (r, i) => (i >= 0 && r[i] != null) ? String(r[i]).trim() : '';
  return rows.slice(1)
    .map((r, i) => ({
      row: i + 2,
      name: get(r, c.name),
      phone: get(r, c.phone),
      whatsapp: get(r, c.whatsapp),
      email: get(r, c.email),
      website: get(r, c.website),
      updated: get(r, c.updated),
    }))
    .filter(p => p.name);
}

async function appendProviderRow(obj) {
  if (!providerCols) await loadProviders();
  const width = Math.max(...Object.values(providerCols)) + 1;
  const row = new Array(width).fill('');
  for (const k in obj) {
    const i = providerCols[k];
    if (i >= 0) row[i] = obj[k];
  }
  const range = encodeURIComponent(`'ספקים'!A:${colLetter(width - 1)}`);
  await driveFetch(sheetUrl(`values/${range}:append?valueInputOption=USER_ENTERED&insertDataOption=INSERT_ROWS`), {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ values: [row] }),
  });
}

async function updateProviderRow(row, obj) {
  if (!providerCols) await loadProviders();
  const data = [];
  for (const k of ['phone', 'whatsapp', 'email', 'website', 'updated']) {
    const i = providerCols[k];
    if (obj[k] === undefined || i < 0) continue;
    data.push({ range: `'ספקים'!${colLetter(i)}${row}`, values: [[obj[k]]] });
  }
  if (!data.length) return;
  await driveFetch(sheetUrl('values:batchUpdate'), {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ valueInputOption: 'USER_ENTERED', data }),
  });
}

function findProvider(name) {
  const n = name.trim();
  return state.providers.find(p => p.name === n);
}

function todayIso() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

function fillProviderList() {
  const dl = $('providerList');
  dl.innerHTML = '';
  state.providers.forEach(p => {
    const o = el('option');
    o.value = p.name;
    dl.append(o);
  });
}

function fillProviderFields() {
  const f = $('addForm');
  const name = f.elements.provider.value.trim();
  const p = findProvider(name);
  const info = $('providerInfo');
  if (!name) {
    info.textContent = '';
    return;
  }
  if (!p) {
    info.textContent = 'ספק חדש. הפרטים שתזיני ייכנסו לטאב "ספקים" בשמירה.';
    return;
  }
  f.elements.phone.value = p.phone;
  f.elements.whatsapp.value = p.whatsapp;
  f.elements.email.value = p.email;
  f.elements.website.value = p.website;
  const updated = parseDate(p.updated);
  const months = updated ? (Date.now() - updated.getTime()) / (30 * 86400000) : Infinity;
  info.textContent = `הפרטים נמצאו בטאב "ספקים", עודכנו: ${p.updated || 'לא ידוע'}`
    + (months > 12 ? '. הם ישנים מעל שנה, כדאי לבדוק באינטרנט.' : '.');
}

function updateProviderCheckbox() {
  const f = $('addForm');
  const p = findProvider(f.elements.provider.value);
  const changed = p && ['phone', 'whatsapp', 'email', 'website'].some(k => {
    const val = (f.elements[k].value || '').trim();
    return val !== '' && val !== p[k];
  });
  $('updProviderWrap').classList.toggle('hidden', !changed);
  if (!changed) $('updProvider').checked = false;
}

$('addForm').addEventListener('input', updateProviderCheckbox);
$('providerInput').addEventListener('input', fillProviderFields);
$('providerInput').addEventListener('change', fillProviderFields);
$('providerSearch').onclick = () => {
  const name = $('providerInput').value.trim();
  if (!name) {
    $('providerInfo').textContent = 'יש להזין שם ספק לפני החיפוש.';
    return;
  }
  window.open('https://www.google.com/search?q=' + encodeURIComponent(name + ' שירות לקוחות'), '_blank', 'noopener');
};

$('typeSelect').onchange = toggleNewType;
$('addBtn').onclick = openAdd;

/* ===== כפתורים ===== */
$('refreshBtn').onclick = () => {
  if (accessToken && Date.now() < tokenExpiresAt) loadAll();
  else tokenClient.requestAccessToken({ prompt: '' });
};
$('logoutBtn').onclick = logout;
$('tabOpen').onclick = () => setView('open');
$('tabDone').onclick = () => setView('done');
let swipe = null;

function activeView() {
  if (!$('detailView').classList.contains('hidden')) return $('detailView');
  if (!$('addView').classList.contains('hidden')) return $('addView');
  return null;
}

function resetViewStyle() {
  ['detailView', 'addView'].forEach(id => {
    const v = $(id);
    v.style.transform = '';
    v.style.opacity = '';
    v.style.transition = '';
  });
}

document.addEventListener('touchstart', e => {
  const view = activeView();
  if (!view || e.target.closest('input, select, textarea, iframe, a, button')) return;
  const t = e.touches[0];
  swipe = { view, x: t.clientX, y: t.clientY, t: Date.now(), dx: 0, locked: false };
}, { passive: true });

document.addEventListener('touchmove', e => {
  if (!swipe) return;
  const t = e.touches[0];
  const dx = t.clientX - swipe.x;
  const dy = t.clientY - swipe.y;
  if (!swipe.locked) {
    if (Math.abs(dy) > 10 && Math.abs(dy) > Math.abs(dx)) { swipe = null; return; }
    if (Math.abs(dx) < 10) return;
    swipe.locked = true;
  }
  swipe.dx = dx;
  swipe.view.style.transition = 'none';
  swipe.view.style.transform = `translateX(${dx}px)`;
  swipe.view.style.opacity = String(Math.max(0.5, 1 - Math.abs(dx) / 500));
}, { passive: true });

document.addEventListener('touchend', () => {
  if (!swipe) return;
  const s = swipe;
  swipe = null;
  if (!s.locked) return;
  const flick = Math.abs(s.dx) > 40 && (Date.now() - s.t) < 250;
  const v = s.view;
  v.style.transition = 'transform .2s ease-out, opacity .2s ease-out';
  if (Math.abs(s.dx) > window.innerWidth * 0.3 || flick) {
    const dir = s.dx > 0 ? 1 : -1;
    v.style.transform = `translateX(${dir * window.innerWidth}px)`;
    v.style.opacity = '0';
    setTimeout(() => history.back(), 200);
  } else {
    v.style.transform = 'translateX(0)';
    v.style.opacity = '1';
  }
}, { passive: true });

$('backBtn').onclick = () => history.back();
$('addBackBtn').onclick = () => history.back();
window.addEventListener('popstate', () => {
  if (!$('detailView').classList.contains('hidden')) closeDoc();
  else if (!$('addView').classList.contains('hidden')) closeAdd();
});

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
}
</script>
